<!DOCTYPE html>
<html>
<body bgcolor="lightblue">

  <h2>Student Registration Form</h2>

  <form>
    Student Name: <input type="text"><br><br>
    Email: <input type="email"><br><br>
    Password: <input type="password"><br><br>
    Age: <input type="number"><br><br>

    Gender: 
    <input type="radio" name="g"> Male
    <input type="radio" name="g"> Female<br><br>

    Skills: 
    <input type="checkbox"> HTML
    <input type="checkbox"> CSS
    <input type="checkbox"> Java<br><br>

    Date of Birth: <input type="date"><br><br>

    Department: 
    <select>
      <option>CSE</option>
      <option>ECE</option>
      <option>EEE</option>
    </select><br><br>

    Address: <textarea rows="4" cols="35"></textarea>
  </form>

</body>
</html>
