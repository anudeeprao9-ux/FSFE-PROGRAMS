<!DOCTYPE html>
<html>
<head>
<style>
  
</style>
</head>
<body>

<div class="box">
  <h2>Employee Registration Form</h2>

  <form>
    Employee Name: <input type="text" placeholder="Enter your name"><br><br>
    Password: <input type="password"><br><br>
    Email: <input type="email"><br><br>
    Mobile Number: <input type="tel"><br><br>
    Age: <input type="number" style="width: 60px;"><br><br>
    Date of Birth: <input type="date"><br><br>
    Preferred Interview Time: <input type="time"><br><br>

    Gender: 
    <input type="radio" name="g"> Male
    <input type="radio" name="g"> Female<br><br>

    Skills: 
    <input type="checkbox"> HTML
    <input type="checkbox"> CSS
    <input type="checkbox"> JavaScript<br><br>

    Select Department: 
    <select>
      <option>Select Department</option>
      <option>CSE</option>
      <option>IT</option>
      <option>HR</option>
    </select><br><br>

    Upload Resume: <input type="file"><br><br>

    Address: <textarea rows="4" cols="32" placeholder="Enter your address" style="vertical-align: bottom;"></textarea><br><br>

    Work Experience: <input type="range"><br><br>

    LinkedIn Profile: <input type="url" placeholder="Enter LinkedIn URL"><br><br>

    <input type="submit" value="Register">
    <input type="reset" value="reset">
  </form>
</div>

</body>
</html>
